name: Audit

# `cargo deny check`, configured by `deny.toml` at the repository root:
# RustSec advisories, yanked versions, licences, duplicate versions and
# dependency sources. Runs on every pull request, and weekly against `main`
# because an advisory lands on a schedule of its own, not when a file here
# changes.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  deny:
    name: cargo deny (advisories, licences, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # `--locked`: audit the committed lockfile, never a re-resolution.
          arguments: --all-features --locked
