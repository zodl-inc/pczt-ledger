[package]
name = "pczt_ledger"
version = "0.1.0"
authors = [
    "Kris Nuttycombe <kris@electriccoin.co>",
    "John Boyd <john@coldnoise.net>",
]
edition = "2021"
rust-version = "1.88"
# The MSRV-aware resolver: `cargo update` prefers dependency releases whose
# `rust-version` this crate's MSRV meets, so a lockfile refresh cannot quietly
# raise the MSRV.
resolver = "3"
# Remove when the crate is ready for its first crates.io release.
publish = false
description = "Transport-agnostic APDU engine for signing Zcash PCZTs with Ledger hardware wallets"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zodl-inc/pczt-ledger"
readme = "README.md"
categories = ["cryptography::cryptocurrencies", "hardware-support"]
keywords = ["zcash", "ledger", "pczt", "hardware-wallet", "apdu"]
# Repository tooling, not part of the crate: CI, the contributor guide, the
# `cargo deny` policy and the toolchain pin, which a dependent ignores anyway.
exclude = [".github/", ".gitignore", "AGENTS.md", "deny.toml", "rust-toolchain.toml"]

[package.metadata.docs.rs]
# `--cfg docsrs` lets rustdoc label each feature-gated item (see the
# `doc_cfg` attribute in `src/lib.rs`).
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# This crate defines the byte stream the firmware parses, so `pczt` moves only
# as a deliberate, tested step — never as a side effect of `cargo update`. What
# holds it in place is the committed `Cargo.lock`, which CI builds with
# `--locked`, as for every other dependency here. The requirement itself is a
# caret range: an exact one would add nothing to that for this crate's own
# builds, and in a published library it would pin every downstream graph with
# it.
#
# `pczt` 0.10.0-pre.0 and the librustzcash crates below are one pre-release
# generation that pins itself exactly (`pczt` requires `zcash_protocol`
# `=0.11.0-pre.0`, and so on), so these requirements name that generation and
# move together: a `zcash_protocol` or `zcash_transparent` other than the one
# `pczt` resolves is a second copy whose types do not interconvert with it.
pczt = { version = "0.10.0-pre.0", default-features = false, features = [
    "orchard",
    "transparent",
    "signer",
] }
zcash_protocol = { version = "0.11.0-pre.0", default-features = false }
# Without the proving stack: no `circuit` (halo2) or `multicore` (rayon).
orchard = { version = "0.16", default-features = false }
zcash_transparent = { version = "0.11.0-pre.0", default-features = false, features = [
    "transparent-inputs",
] }
zcash_address = { version = "0.14.0-pre.0", default-features = false }
zcash_encoding = { version = "0.5", default-features = false }
zip32 = { version = "0.3", default-features = false }
secp256k1 = { version = "0.33", default-features = false }
subtle = { version = "2", default-features = false }
blake2b_simd = { version = "1", default-features = false }
ff = { version = "0.14", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc", "derive"] }
hidapi = { version = "2.6", optional = true }

[features]
default = ["std"]
## The standard library. Adds the `transport` module — the `Transport` trait
## and its two optional implementations — and the blocking `ceremony` runner,
## and lets the errors that wrap a dependency's error report it as their
## `source`. Without it the crate is `#![no_std]` with `alloc`: the whole
## signing path, none of the I/O.
std = [
    "pczt/std",
    "zcash_protocol/std",
    "orchard/std",
    "zcash_transparent/std",
    "zcash_address/std",
    "zcash_encoding/std",
    "zip32/std",
    "secp256k1/std",
    "subtle/std",
    "blake2b_simd/std",
    "ff/std",
    "zeroize/std",
]
## Enables the USB HID transport (`transport::hid`). Implies `std`.
transport-hid = ["std", "dep:hidapi"]
## Enables the speculos TCP transport (`transport::speculos`). Implies `std`.
## Pure `std::net`, so it pulls in no dependency of its own.
transport-speculos = ["std"]

[dev-dependencies]
hex = "0.4"
pczt = { version = "0.10.0-pre.0", default-features = false, features = [
    "io-finalizer",
    "spend-finalizer",
    "tx-extractor",
    "zcp-builder",
] }
zcash_primitives = { version = "0.31.0-pre.0", features = ["transparent-inputs"] }
zcash_transparent = { version = "0.11.0-pre.0", features = ["transparent-inputs"] }
zcash_protocol = { version = "0.11.0-pre.0", features = ["local-consensus"] }
rand = "0.10"
sapling_crypto = { package = "sapling-crypto", version = "0.9" }
proptest = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
